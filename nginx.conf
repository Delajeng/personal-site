# Served behind Pangolin / Traefik / an Ingress, which terminate TLS.

# Cache policy by file type:
#  - HTML/XML/JSON always revalidate, so new posts show up immediately.
#  - Hugo fingerprints CSS/JS and processed images, so those cache for 30 days.
map $uri $cache_control {
    default                                                   "no-cache";
    ~*\.(?:css|js|png|jpe?g|webp|avif|gif|svg|ico|woff2?)$    "public, max-age=2592000, immutable";
}

server {
    # IPv4 only on purpose: an IPv6 listener makes nginx refuse to start on
    # hosts/LXCs/pods where IPv6 is disabled.
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    charset utf-8;

    # Behind a proxy the container's own port (8080) must never leak into
    # redirects, e.g. /docs -> /docs/.
    absolute_redirect off;
    port_in_redirect  off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    add_header Cache-Control          $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # Liveness/readiness probe for Docker and Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
